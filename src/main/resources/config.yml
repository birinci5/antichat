prefix: "&8[&cAntiCheat&8]&7"

messages:
  alert: "%prefix% &e%player% &7oyuncusu &b%check% &7suphesi! &7(VL: &c%vl%&7/%maxvl%) &8- %info%"
  kick-broadcast: "%prefix% &c%player% &7oyuncusu &c%check%&7 VL limitini asarak &4ATILDI&7."
  kick-reason: "Hile Suphesi / Baglantinizi Kontrol Edin"
