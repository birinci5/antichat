name: AntiCheat Jar Derle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4

    - name: JDK 21 Kur
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Gradle Kur ve Derle
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle
        gradle build --no-daemon

    - name: Jar Dosyasini Yukle
      uses: actions/upload-artifact@v4
      with:
        name: AntiCheat-jar
        path: build/libs/*.jar
